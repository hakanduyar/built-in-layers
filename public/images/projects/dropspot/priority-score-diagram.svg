<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="psd-title psd-desc">
  <title id="psd-title">DropSpot priority-score diagram</title>
  <desc id="psd-desc">A diagram of DropSpot's waitlist priority-score formula: a SHA-256 seed derived from the git remote URL, the first commit timestamp, and a build-time value produces three coefficients unique to the deployment, which combine with signup latency, account age, and a rapid-action penalty into a single priority score used to order the waitlist. This is a verified architecture diagram traced to the audited repository, not a product screenshot.</desc>

  <rect width="1600" height="1000" fill="#f1efe8" />

  <text x="64" y="72" font-family="ui-monospace, 'IBM Plex Mono', monospace" font-size="22" letter-spacing="2" fill="#504e48">VERIFIED ARCHITECTURE DIAGRAM</text>
  <line x1="64" y1="96" x2="1536" y2="96" stroke="#b8b5ac" stroke-width="1" />

  <text x="64" y="176" font-family="ui-sans-serif, 'Archivo', system-ui, sans-serif" font-size="52" font-weight="600" fill="#161616">A seed, not a fixed formula</text>
  <text x="64" y="220" font-family="ui-sans-serif, 'Archivo', system-ui, sans-serif" font-size="24" fill="#504e48">Waitlist priority, from a deployment-unique seed to a single score</text>

  <!-- Seed inputs -->
  <rect x="64" y="290" width="440" height="180" fill="none" stroke="#b8b5ac" stroke-width="1" />
  <text x="88" y="326" font-family="ui-sans-serif, 'Archivo', system-ui, sans-serif" font-size="24" font-weight="600" fill="#161616">Seed inputs</text>
  <line x1="88" y1="346" x2="480" y2="346" stroke="#b8b5ac" stroke-width="1" />
  <text x="88" y="378" font-family="ui-monospace, 'IBM Plex Mono', monospace" font-size="16" fill="#504e48">git remote URL</text>
  <text x="88" y="404" font-family="ui-monospace, 'IBM Plex Mono', monospace" font-size="16" fill="#504e48">first commit timestamp</text>
  <text x="88" y="430" font-family="ui-monospace, 'IBM Plex Mono', monospace" font-size="16" fill="#504e48">build-time value</text>
  <text x="88" y="456" font-family="ui-sans-serif, 'Archivo', system-ui, sans-serif" font-size="15" fill="#504e48">SHA-256, first 12 hex characters</text>

  <path d="M 504 380 L 564 380" stroke="#161616" stroke-width="2" fill="none" marker-end="url(#ah)" />

  <!-- Coefficients -->
  <rect x="568" y="290" width="400" height="180" fill="none" stroke="#e04413" stroke-width="2" />
  <text x="592" y="326" font-family="ui-sans-serif, 'Archivo', system-ui, sans-serif" font-size="24" font-weight="600" fill="#161616">Coefficients</text>
  <line x1="592" y1="346" x2="944" y2="346" stroke="#b8b5ac" stroke-width="1" />
  <text x="592" y="378" font-family="ui-monospace, 'IBM Plex Mono', monospace" font-size="16" fill="#504e48">A = 7–11 (from seed)</text>
  <text x="592" y="404" font-family="ui-monospace, 'IBM Plex Mono', monospace" font-size="16" fill="#504e48">B = 13–19 (from seed)</text>
  <text x="592" y="430" font-family="ui-monospace, 'IBM Plex Mono', monospace" font-size="16" fill="#504e48">C = 3–5 (from seed)</text>
  <text x="592" y="456" font-family="ui-sans-serif, 'Archivo', system-ui, sans-serif" font-size="15" fill="#504e48">Different per deployment</text>

  <path d="M 968 380 L 1028 380" stroke="#161616" stroke-width="2" fill="none" marker-end="url(#ah)" />

  <!-- Signals -->
  <rect x="1032" y="290" width="500" height="180" fill="none" stroke="#b8b5ac" stroke-width="1" />
  <text x="1056" y="326" font-family="ui-sans-serif, 'Archivo', system-ui, sans-serif" font-size="24" font-weight="600" fill="#161616">Per-signup signals</text>
  <line x1="1056" y1="346" x2="1508" y2="346" stroke="#b8b5ac" stroke-width="1" />
  <text x="1056" y="378" font-family="ui-monospace, 'IBM Plex Mono', monospace" font-size="16" fill="#504e48">signup_latency_ms</text>
  <text x="1056" y="404" font-family="ui-monospace, 'IBM Plex Mono', monospace" font-size="16" fill="#504e48">account_age_days</text>
  <text x="1056" y="430" font-family="ui-monospace, 'IBM Plex Mono', monospace" font-size="16" fill="#504e48">rapid_actions (last 10 min)</text>
  <text x="1056" y="456" font-family="ui-sans-serif, 'Archivo', system-ui, sans-serif" font-size="15" fill="#b8380e">latency term ≈ 0ms in the current frontend</text>

  <path d="M 292 470 L 292 530" stroke="#161616" stroke-width="2" fill="none" marker-end="url(#ah)" />
  <path d="M 768 470 L 768 530" stroke="#161616" stroke-width="1.5" fill="none" />
  <path d="M 1282 470 L 1282 530" stroke="#161616" stroke-width="1.5" fill="none" />
  <path d="M 292 530 L 1282 530" stroke="#161616" stroke-width="1.5" fill="none" />
  <path d="M 768 530 L 768 570" stroke="#161616" stroke-width="2" fill="none" marker-end="url(#ah)" />

  <!-- Formula -->
  <rect x="264" y="574" width="1072" height="150" fill="#e5e2d8" stroke="#b8b5ac" stroke-width="1" />
  <text x="800" y="624" text-anchor="middle" font-family="ui-monospace, 'IBM Plex Mono', monospace" font-size="22" fill="#161616">score = 1000 + (latency_ms % A)</text>
  <text x="800" y="656" text-anchor="middle" font-family="ui-monospace, 'IBM Plex Mono', monospace" font-size="22" fill="#161616">+ (account_age_days % B) − (rapid_actions % C)</text>
  <text x="800" y="694" text-anchor="middle" font-family="ui-sans-serif, 'Archivo', system-ui, sans-serif" font-size="17" fill="#504e48">Floored at zero</text>

  <path d="M 800 724 L 800 764" stroke="#161616" stroke-width="2" fill="none" marker-end="url(#ah)" />

  <rect x="600" y="768" width="400" height="90" fill="none" stroke="#161616" stroke-width="2" />
  <text x="800" y="812" text-anchor="middle" font-family="ui-sans-serif, 'Archivo', system-ui, sans-serif" font-size="22" font-weight="600" fill="#161616">Waitlist priority score</text>
  <text x="800" y="838" text-anchor="middle" font-family="ui-sans-serif, 'Archivo', system-ui, sans-serif" font-size="16" fill="#504e48">Orders who can claim first</text>

  <text x="64" y="890" font-family="ui-sans-serif, 'Archivo', system-ui, sans-serif" font-size="18" fill="#b8380e">
    <tspan x="64" dy="0">In the current frontend, signup_latency_ms is measured between two Date.now() calls issued back to</tspan>
    <tspan x="64" dy="24">back, so it contributes almost nothing — account age and the rapid-action penalty do the real work.</tspan>
  </text>

  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#161616" />
    </marker>
  </defs>

  <line x1="64" y1="944" x2="1536" y2="944" stroke="#b8b5ac" stroke-width="1" />
  <text x="64" y="972" font-family="ui-monospace, 'IBM Plex Mono', monospace" font-size="18" letter-spacing="1" fill="#504e48">Formula verified against dropspot-backend/src/utils/seedGenerator.js — not a captured screen.</text>
</svg>
