<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="ctd-title ctd-desc">
  <title id="ctd-title">DropSpot claim transaction diagram</title>
  <desc id="ctd-desc">A diagram of DropSpot's claim transaction: a single PostgreSQL transaction that takes a row lock on the caller's existing claim, returns early if one already exists, takes a row lock on the drop while checking the claim window, checks remaining stock and the caller's recomputed waitlist position, then commits three writes together — insert the claim, decrement available stock, delete the waitlist entry — or rolls all of them back on any failed check. This is a verified architecture diagram traced to the audited repository, not a product screenshot.</desc>

  <rect width="1600" height="1000" fill="#f1efe8" />

  <text x="64" y="72" font-family="ui-monospace, 'IBM Plex Mono', monospace" font-size="22" letter-spacing="2" fill="#504e48">VERIFIED ARCHITECTURE DIAGRAM</text>
  <line x1="64" y1="96" x2="1536" y2="96" stroke="#b8b5ac" stroke-width="1" />

  <text x="64" y="176" font-family="ui-sans-serif, 'Archivo', system-ui, sans-serif" font-size="52" font-weight="600" fill="#161616">One claim, one transaction</text>
  <text x="64" y="220" font-family="ui-sans-serif, 'Archivo', system-ui, sans-serif" font-size="24" fill="#504e48">Row locks taken before any check, three writes committed together</text>

  <!-- Transaction boundary -->
  <rect x="64" y="270" width="1472" height="630" fill="none" stroke="#161616" stroke-width="2" />
  <text x="88" y="304" font-family="ui-monospace, 'IBM Plex Mono', monospace" font-size="18" letter-spacing="2" fill="#161616">BEGIN — SINGLE POSTGRESQL TRANSACTION</text>

  <!-- Step 1 -->
  <rect x="104" y="336" width="440" height="130" fill="none" stroke="#b8b5ac" stroke-width="1" />
  <text x="128" y="372" font-family="ui-sans-serif, 'Archivo', system-ui, sans-serif" font-size="24" font-weight="600" fill="#161616">1. Lock existing claim</text>
  <text x="128" y="400" font-family="ui-monospace, 'IBM Plex Mono', monospace" font-size="15" fill="#504e48">SELECT ... FOR UPDATE</text>
  <text x="128" y="426" font-family="ui-sans-serif, 'Archivo', system-ui, sans-serif" font-size="17" fill="#504e48">If found: commit, return existing claim</text>
  <text x="128" y="448" font-family="ui-sans-serif, 'Archivo', system-ui, sans-serif" font-size="17" fill="#504e48">(idempotent — no duplicate claim)</text>

  <path d="M 544 400 L 584 400" stroke="#161616" stroke-width="2" fill="none" marker-end="url(#ah)" />

  <!-- Step 2 -->
  <rect x="588" y="336" width="440" height="130" fill="none" stroke="#e04413" stroke-width="2" />
  <text x="612" y="372" font-family="ui-sans-serif, 'Archivo', system-ui, sans-serif" font-size="24" font-weight="600" fill="#161616">2. Lock the drop</text>
  <text x="612" y="400" font-family="ui-monospace, 'IBM Plex Mono', monospace" font-size="15" fill="#504e48">SELECT ... FOR UPDATE</text>
  <text x="612" y="426" font-family="ui-sans-serif, 'Archivo', system-ui, sans-serif" font-size="17" fill="#504e48">WHERE NOW() is inside the</text>
  <text x="612" y="448" font-family="ui-sans-serif, 'Archivo', system-ui, sans-serif" font-size="17" fill="#504e48">claim window; else rollback</text>

  <path d="M 1028 400 L 1068 400" stroke="#161616" stroke-width="2" fill="none" marker-end="url(#ah)" />

  <!-- Step 3 -->
  <rect x="1072" y="336" width="440" height="130" fill="none" stroke="#b8b5ac" stroke-width="1" />
  <text x="1096" y="372" font-family="ui-sans-serif, 'Archivo', system-ui, sans-serif" font-size="24" font-weight="600" fill="#161616">3. Check stock &amp; position</text>
  <text x="1096" y="400" font-family="ui-sans-serif, 'Archivo', system-ui, sans-serif" font-size="17" fill="#504e48">available_stock &gt; 0, and caller's</text>
  <text x="1096" y="422" font-family="ui-sans-serif, 'Archivo', system-ui, sans-serif" font-size="17" fill="#504e48">recomputed waitlist position is</text>
  <text x="1096" y="444" font-family="ui-sans-serif, 'Archivo', system-ui, sans-serif" font-size="17" fill="#504e48">within available stock; else rollback</text>

  <path d="M 1292 466 L 1292 506" stroke="#161616" stroke-width="2" fill="none" marker-end="url(#ah)" />

  <!-- Step 4: three atomic writes -->
  <text x="104" y="540" font-family="ui-monospace, 'IBM Plex Mono', monospace" font-size="16" letter-spacing="1" fill="#161616">4. THREE WRITES, COMMITTED TOGETHER</text>

  <rect x="104" y="560" width="450" height="120" fill="#e5e2d8" stroke="#b8b5ac" stroke-width="1" />
  <text x="128" y="596" font-family="ui-sans-serif, 'Archivo', system-ui, sans-serif" font-size="22" font-weight="600" fill="#161616">INSERT claim</text>
  <text x="128" y="622" font-family="ui-sans-serif, 'Archivo', system-ui, sans-serif" font-size="16" fill="#504e48">Unique claim_code generated</text>
  <text x="128" y="644" font-family="ui-sans-serif, 'Archivo', system-ui, sans-serif" font-size="16" fill="#504e48">for the claims table</text>

  <rect x="580" y="560" width="450" height="120" fill="#e5e2d8" stroke="#b8b5ac" stroke-width="1" />
  <text x="604" y="596" font-family="ui-sans-serif, 'Archivo', system-ui, sans-serif" font-size="22" font-weight="600" fill="#161616">UPDATE drops</text>
  <text x="604" y="622" font-family="ui-sans-serif, 'Archivo', system-ui, sans-serif" font-size="16" fill="#504e48">available_stock decremented</text>
  <text x="604" y="644" font-family="ui-sans-serif, 'Archivo', system-ui, sans-serif" font-size="16" fill="#504e48">by exactly one</text>

  <rect x="1056" y="560" width="450" height="120" fill="#e5e2d8" stroke="#b8b5ac" stroke-width="1" />
  <text x="1080" y="596" font-family="ui-sans-serif, 'Archivo', system-ui, sans-serif" font-size="22" font-weight="600" fill="#161616">DELETE waitlist entry</text>
  <text x="1080" y="622" font-family="ui-sans-serif, 'Archivo', system-ui, sans-serif" font-size="16" fill="#504e48">The caller's row is removed</text>
  <text x="1080" y="644" font-family="ui-sans-serif, 'Archivo', system-ui, sans-serif" font-size="16" fill="#504e48">from the waitlist table</text>

  <path d="M 329 680 L 329 720" stroke="#161616" stroke-width="1.5" fill="none" />
  <path d="M 805 680 L 805 720" stroke="#161616" stroke-width="1.5" fill="none" />
  <path d="M 1281 680 L 1281 720" stroke="#161616" stroke-width="1.5" fill="none" />
  <path d="M 329 720 L 1281 720" stroke="#161616" stroke-width="1.5" fill="none" />
  <path d="M 805 720 L 805 750" stroke="#161616" stroke-width="2" fill="none" marker-end="url(#ah)" />

  <rect x="605" y="754" width="400" height="80" fill="none" stroke="#161616" stroke-width="2" />
  <text x="805" y="802" text-anchor="middle" font-family="ui-monospace, 'IBM Plex Mono', monospace" font-size="20" letter-spacing="2" fill="#161616">COMMIT</text>

  <text x="104" y="866" font-family="ui-sans-serif, 'Archivo', system-ui, sans-serif" font-size="19" fill="#504e48">
    <tspan x="104" dy="0">Any failed check rolls back the whole transaction — a claim never</tspan>
    <tspan x="104" dy="26">partially succeeds, and two simultaneous claims for the last unit</tspan>
    <tspan x="104" dy="26">of stock cannot both pass step 3.</tspan>
  </text>

  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#161616" />
    </marker>
  </defs>

  <line x1="64" y1="944" x2="1536" y2="944" stroke="#b8b5ac" stroke-width="1" />
  <text x="64" y="972" font-family="ui-monospace, 'IBM Plex Mono', monospace" font-size="18" letter-spacing="1" fill="#504e48">Read directly from dropspot-backend/src/models/Claim.js — not a captured screen.</text>
</svg>
