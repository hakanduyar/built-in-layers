<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="bsa-title bsa-desc">
  <title id="bsa-title">Book-scoped authorization diagram: what is permission-checked and what is not</title>
  <desc id="bsa-desc">A two-path diagram. The top path, for accounts, categories, and tags, shows a request resolving its target book, then a permission check against the caller's real membership role, then a book-scoped database query — real, enforced authorization. The bottom path, for transactions, shows a request going straight to a query filtered only by the caller's own user id, with no book resolution or permission check at all, exactly as it worked before this fork's changes. This is a verified architecture diagram traced to the audited repository, not a product screenshot.</desc>

  <rect width="1600" height="1000" fill="#f1efe8" />

  <text x="64" y="72" font-family="ui-monospace, 'IBM Plex Mono', monospace" font-size="22" letter-spacing="2" fill="#504e48">VERIFIED ARCHITECTURE DIAGRAM</text>
  <line x1="64" y1="96" x2="1536" y2="96" stroke="#b8b5ac" stroke-width="1" />

  <text x="64" y="176" font-family="ui-sans-serif, 'Archivo', system-ui, sans-serif" font-size="52" font-weight="600" fill="#161616">Two paths, one gap</text>
  <text x="64" y="220" font-family="ui-sans-serif, 'Archivo', system-ui, sans-serif" font-size="24" fill="#504e48">What is book-permission-checked today, and what still is not</text>

  <!-- Row label: implemented path -->
  <text x="64" y="292" font-family="ui-sans-serif, 'Archivo', system-ui, sans-serif" font-size="22" font-weight="600" fill="#161616">Account, Category, Tag</text>

  <!-- Implemented path: 4 boxes -->
  <g>
    <rect x="64" y="316" width="330" height="140" fill="none" stroke="#b8b5ac" stroke-width="1" />
    <text x="94" y="366" font-family="ui-sans-serif, 'Archivo', system-ui, sans-serif" font-size="20" font-weight="600" fill="#161616">Request</text>
    <text x="94" y="396" font-family="ui-monospace, 'IBM Plex Mono', monospace" font-size="15" fill="#504e48">carries a bookId</text>
  </g>
  <path d="M 394 386 L 434 386" stroke="#161616" stroke-width="2" fill="none" marker-end="url(#ah)" />

  <g>
    <rect x="438" y="316" width="330" height="140" fill="none" stroke="#b8b5ac" stroke-width="1" />
    <text x="468" y="360" font-family="ui-sans-serif, 'Archivo', system-ui, sans-serif" font-size="19" font-weight="600" fill="#161616">resolveBookContext</text>
    <text x="468" y="390" font-family="ui-monospace, 'IBM Plex Mono', monospace" font-size="15" fill="#504e48">
      <tspan x="468" dy="0">defaults to caller's</tspan>
      <tspan x="468" dy="20">own personal book</tspan>
    </text>
  </g>
  <path d="M 768 386 L 808 386" stroke="#161616" stroke-width="2" fill="none" marker-end="url(#ah)" />

  <g>
    <rect x="812" y="316" width="330" height="140" fill="none" stroke="#e04413" stroke-width="2" />
    <text x="842" y="360" font-family="ui-sans-serif, 'Archivo', system-ui, sans-serif" font-size="19" font-weight="600" fill="#161616">CheckBookPermission</text>
    <text x="842" y="390" font-family="ui-monospace, 'IBM Plex Mono', monospace" font-size="15" fill="#504e48">
      <tspan x="842" dy="0">real membership +</tspan>
      <tspan x="842" dy="20">role lookup</tspan>
    </text>
  </g>
  <path d="M 1142 386 L 1182 386" stroke="#161616" stroke-width="2" fill="none" marker-end="url(#ah)" />

  <g>
    <rect x="1186" y="316" width="350" height="140" fill="#e5e2d8" stroke="#b8b5ac" stroke-width="1" />
    <text x="1216" y="360" font-family="ui-sans-serif, 'Archivo', system-ui, sans-serif" font-size="19" font-weight="600" fill="#161616">Book-scoped query</text>
    <text x="1216" y="390" font-family="ui-monospace, 'IBM Plex Mono', monospace" font-size="15" fill="#504e48">WHERE book_id=?</text>
  </g>

  <line x1="64" y1="500" x2="1536" y2="500" stroke="#b8b5ac" stroke-width="1" stroke-dasharray="4 8" />

  <!-- Row label: not-yet path -->
  <text x="64" y="572" font-family="ui-sans-serif, 'Archivo', system-ui, sans-serif" font-size="22" font-weight="600" fill="#161616">Transaction</text>

  <!-- Not-yet path: 2 boxes, dashed, muted -->
  <g>
    <rect x="64" y="596" width="330" height="140" fill="none" stroke="#b8b5ac" stroke-width="1" stroke-dasharray="6 6" />
    <text x="94" y="646" font-family="ui-sans-serif, 'Archivo', system-ui, sans-serif" font-size="20" font-weight="600" fill="#161616">Request</text>
    <text x="94" y="676" font-family="ui-monospace, 'IBM Plex Mono', monospace" font-size="15" fill="#504e48">no book resolution</text>
  </g>
  <path d="M 394 666 L 1182 666" stroke="#504e48" stroke-width="1.5" stroke-dasharray="6 6" fill="none" marker-end="url(#ah-muted)" />
  <text x="700" y="646" font-family="ui-monospace, 'IBM Plex Mono', monospace" font-size="15" fill="#b8380e">no permission check runs here</text>

  <g>
    <rect x="1186" y="596" width="350" height="140" fill="none" stroke="#b8b5ac" stroke-width="1" stroke-dasharray="6 6" />
    <text x="1216" y="640" font-family="ui-sans-serif, 'Archivo', system-ui, sans-serif" font-size="19" font-weight="600" fill="#161616">Same query as before</text>
    <text x="1216" y="670" font-family="ui-monospace, 'IBM Plex Mono', monospace" font-size="15" fill="#504e48">
      <tspan x="1216" dy="0">WHERE uid=?</tspan>
      <tspan x="1216" dy="20">(bookId column unused in reads)</tspan>
    </text>
  </g>

  <g>
    <rect x="64" y="784" width="1472" height="94" fill="none" stroke="#b8b5ac" stroke-width="1" />
    <text x="94" y="820" font-family="ui-sans-serif, 'Archivo', system-ui, sans-serif" font-size="18" font-weight="600" fill="#161616">Two members of the same shared book cannot yet see each other's transactions</text>
    <text x="94" y="850" font-family="ui-sans-serif, 'Archivo', system-ui, sans-serif" font-size="16" fill="#504e48">through this system — the permission boundary above is real for three entities, not for the fourth.</text>
  </g>

  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#161616" />
    </marker>
    <marker id="ah-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#504e48" />
    </marker>
  </defs>

  <line x1="64" y1="944" x2="1536" y2="944" stroke="#b8b5ac" stroke-width="1" />
  <text x="64" y="972" font-family="ui-monospace, 'IBM Plex Mono', monospace" font-size="18" letter-spacing="1" fill="#504e48">Read directly from pkg/api/{accounts,transactions}.go and pkg/services/transactions.go — not a captured screen.</text>
</svg>
