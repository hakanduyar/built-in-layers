<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="bdm-title bdm-desc">
  <title id="bdm-title">Book, BookMember, and BookInvitation data model diagram</title>
  <desc id="bdm-desc">A diagram of the Book, BookMember, and BookInvitation tables. Book holds an owner and a personal-or-shared type. BookMember links a book to a user with an owner, editor, or viewer role, one row per book-and-user pair. BookInvitation is drawn with a dashed border and a note that the table and its status values exist but no service or API code creates, sends, or accepts an invitation yet. This is a verified architecture diagram traced to the audited repository, not a product screenshot.</desc>

  <rect width="1600" height="1000" fill="#f1efe8" />

  <text x="64" y="72" font-family="ui-monospace, 'IBM Plex Mono', monospace" font-size="22" letter-spacing="2" fill="#504e48">VERIFIED ARCHITECTURE DIAGRAM</text>
  <line x1="64" y1="96" x2="1536" y2="96" stroke="#b8b5ac" stroke-width="1" />

  <text x="64" y="176" font-family="ui-sans-serif, 'Archivo', system-ui, sans-serif" font-size="52" font-weight="600" fill="#161616">Book, BookMember, BookInvitation</text>
  <text x="64" y="220" font-family="ui-sans-serif, 'Archivo', system-ui, sans-serif" font-size="24" fill="#504e48">Three new tables; one of them has no code behind it yet</text>

  <!-- Book (top center) -->
  <g>
    <rect x="620" y="270" width="360" height="200" fill="none" stroke="#161616" stroke-width="2" />
    <text x="650" y="316" font-family="ui-sans-serif, 'Archivo', system-ui, sans-serif" font-size="26" font-weight="600" fill="#161616">Book</text>
    <line x1="650" y1="336" x2="950" y2="336" stroke="#b8b5ac" stroke-width="1" />
    <text x="650" y="366" font-family="ui-monospace, 'IBM Plex Mono', monospace" font-size="16" fill="#504e48">
      <tspan x="650" dy="0">bookId (PK)</tspan>
      <tspan x="650" dy="24">ownerUid</tspan>
      <tspan x="650" dy="24">bookType: PERSONAL | SHARED</tspan>
    </text>
  </g>

  <!-- Book -> BookMember -->
  <path d="M 720 470 L 480 620" stroke="#161616" stroke-width="1.5" fill="none" marker-end="url(#ah)" />
  <text x="560" y="540" font-family="ui-monospace, 'IBM Plex Mono', monospace" font-size="14" fill="#504e48">1 — many</text>

  <!-- Book -> BookInvitation (dashed, unused) -->
  <path d="M 880 470 L 1120 620" stroke="#504e48" stroke-width="1.5" stroke-dasharray="6 6" fill="none" marker-end="url(#ah-muted)" />
  <text x="1000" y="540" font-family="ui-monospace, 'IBM Plex Mono', monospace" font-size="14" fill="#504e48">1 — many, unused</text>

  <!-- BookMember (bottom left, signal accent) -->
  <g>
    <rect x="150" y="624" width="440" height="240" fill="none" stroke="#e04413" stroke-width="2" />
    <text x="180" y="670" font-family="ui-sans-serif, 'Archivo', system-ui, sans-serif" font-size="26" font-weight="600" fill="#161616">BookMember</text>
    <line x1="180" y1="690" x2="560" y2="690" stroke="#b8b5ac" stroke-width="1" />
    <text x="180" y="722" font-family="ui-monospace, 'IBM Plex Mono', monospace" font-size="16" fill="#504e48">
      <tspan x="180" dy="0">bookMemberId (PK)</tspan>
      <tspan x="180" dy="24">bookId, uid — unique together</tspan>
      <tspan x="180" dy="24">role: OWNER | EDITOR | VIEWER</tspan>
      <tspan x="180" dy="24">deleted</tspan>
    </text>
  </g>

  <!-- BookInvitation (bottom right, dashed/muted, unimplemented) -->
  <g>
    <rect x="1010" y="624" width="460" height="240" fill="none" stroke="#b8b5ac" stroke-width="1.5" stroke-dasharray="8 6" />
    <text x="1040" y="670" font-family="ui-sans-serif, 'Archivo', system-ui, sans-serif" font-size="26" font-weight="600" fill="#161616">BookInvitation</text>
    <line x1="1040" y1="690" x2="1440" y2="690" stroke="#b8b5ac" stroke-width="1" />
    <text x="1040" y="720" font-family="ui-monospace, 'IBM Plex Mono', monospace" font-size="15" fill="#504e48">
      <tspan x="1040" dy="0">invitationId, bookId,</tspan>
      <tspan x="1040" dy="22">inviteeUid / inviteeEmail</tspan>
      <tspan x="1040" dy="22">status: PENDING | ACCEPTED |</tspan>
      <tspan x="1040" dy="22">DECLINED | REVOKED | EXPIRED</tspan>
    </text>
  </g>

  <g>
    <rect x="1010" y="874" width="460" height="66" fill="#e5e2d8" stroke="#b8b5ac" stroke-width="1" />
    <text x="1030" y="900" font-family="ui-sans-serif, 'Archivo', system-ui, sans-serif" font-size="15" fill="#b8380e">
      <tspan x="1030" dy="0">Table exists. No service or API code</tspan>
      <tspan x="1030" dy="20">creates, sends, or accepts one yet.</tspan>
    </text>
  </g>

  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#161616" />
    </marker>
    <marker id="ah-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#504e48" />
    </marker>
  </defs>

  <line x1="64" y1="944" x2="1536" y2="944" stroke="#b8b5ac" stroke-width="1" />
  <text x="64" y="972" font-family="ui-monospace, 'IBM Plex Mono', monospace" font-size="18" letter-spacing="1" fill="#504e48">Read directly from pkg/models/book.go — not a captured screen.</text>
</svg>
